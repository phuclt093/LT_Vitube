# Đưa giao diện vitube lên GitHub Pages mỗi lần push lên main.
# Settings → Pages → Source: "GitHub Actions". Chi tiết: docs/GITHUB-PAGES.md
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vitube-web/package-lock.json

      # base_path = "/<tên-repo>" cho trang dự án
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
        working-directory: vitube-web

      - run: npm run build:pages
        working-directory: vitube-web
        env:
          VITUBE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_VITUBE_API_URL: ${{ vars.VITUBE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vitube-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
